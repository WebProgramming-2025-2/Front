<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이어리 테마 선택-Mogle</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left-header {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .middle_menu {
            justify-content: flex-start;
            padding-left: 80px;
            gap: 8px;
        }
       
        .middle_menu input {
            font-family: var(--font-main);
            font-size: var(--font-medium);
            color: black;
            background: transparent;
            border: none;
            outline: none;
            padding: 4px 2px;      /* 아주 작은 padding */
            line-height: 1.5;      /* 충분한 line-height */
            cursor: text;
            width: 425px;
            min-height: 30px;      /* 최소 높이 확보 */
            position: relative;
            z-index: 10;
            pointer-events: auto;
        }

        .middle_menu input::placeholder {
            color: var(--shadow-gray)
        }

        .title-with-star form {
            width: 100%;
        }

        .star-icon {
            position: static;
            width: 40px;
            height: 40px;
        }

        .container {
            max-width: 1280px;
            min-height: calc(100vh - 120px); 
            height: auto; 
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 30px 50px 0px 0px;
            margin-left: auto;
            margin-right: auto;
            align-items: center;
        }



        .left-section {
            display: flex;
            justify-content: center;
            align-items: flex-start; 
        }

        .notebook-card {
            height: 550px;
            width: 460px;
            aspect-ratio: 0.75;
            background: url('../content/cover4.png');
            background-size: cover;
            background-position: center;
            border-radius: 30px;
            padding: 60px 50px;
            position: relative;
            overflow: hidden;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            place-items: center;
            
        }

        .theme-card {
            height: 190px;
            width: 170px;
            aspect-ratio: 0.7;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .theme-card:hover {
            transform: translateY(-5px) scale(1.02);
        }
    </style>
</head>
<body>
    <div class="background-decorations">
        <div class="bg-clover"></div>
        <div class="bg-star"></div>
        <div class="bg-sparkle"></div>
    </div>    
    <div class="nav">
        <div class="left_menu">
            <h2><a href="index.html">Mogle</a></h2>
            <p class="subtitle"><b>모</b>여서 쓰는 <b>글</b></p>
        </div>
        <!-- 나중에 css 머지 하면 수정 -->
        <div class="middle_menu">
            <div class="title-with-star">
                <form action=""><input type="text" placeholder="다이어리의 이름을 작성하세요."></form>
            </div>
        </div>
        <div class="multi-profile">
            <img src="../content/clover-user-profile.png">
            <img src="../content/user-profile.png" alt="profile">
        </div>
    </div>
    <div class="container">
        <div class="left-section">
            <div class="notebook-card">
            </div>
        </div>

        <div class="right-section">
            <div class="theme-grid">
                <div class="theme-card">
                    <img src="../content/cover1.png" alt="테마 1" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../content/cover2.png" alt="테마 2" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../content/cover3.png" alt="테마 3" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../content/cover4.png" alt="테마 4" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../content/cover5.png" alt="테마 5" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../content/cover6.png" alt="테마 6" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
            </div>

            <button class="btn-gradient cloud" style="width: 451px; height: 70px; margin-left: auto; margin-right: auto; font-size: var(--font-small);">다이어리 생성</button>
        </div>
    </div>
</body>
</html>
