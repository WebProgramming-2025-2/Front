<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>책장 생성 - Mogle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <style>
           html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* ==================== 스크롤 버튼 스타일 ==================== */
        .scroll-button {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--background);
            box-shadow: var(--box-shadow);
            border: none;
            cursor: pointer;
            font-size: var(--font-medium);
            line-height: 40px;
            text-align: center;
            font-weight: bold;
            color: var(--blue-text);
            transition: background 0.2s;
            z-index: 5;
        }

        .scroll-button:hover {
            background-color: var(--star-blue);
            color: white;
        }

        /* ==================== 메인 컨텐츠 그리드 배치 ==================== */
        .main-content-grid {
            height: calc(100vh - 96px);
            padding: 30px 78px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr;
            gap: 30px;
            overflow-y: auto;
        }

        /* ==================== 책장 카드 ==================== */
        .book-card {
            position: relative;
            flex-shrink: 0;
            width: 215px;
            height: 215px;
            border-radius: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .book-title {
            font-size: var(--font-very-small);
            color: #000;
            margin: 0;
            padding-left: 5px;
        }

        .horizontal-scroll-section {
            position: relative;
            padding-right: 50px;
            width: 1190px;
            max-width: calc(100vw - 78px * 2 - 50px);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .bookshelf-row {
            display: flex;
            gap: 40px;
            position: relative;
            left: 0;
            transition: left 0.3s ease-out;
            flex-wrap: nowrap;
            justify-content: flex-start;
        }

        .middle_menu .active {
            background-color: var(--star-blue);
            padding: 10px 20px;
            border-radius: 8px;
        }
        /* ==================== 팝업 ==================== */
        .add-book-popup {
            position: absolute;
            top: 195px;
            left: 510px;
            width: 580px;
            background-color: var(--background);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            /* 이 페이지에서는 팝업이 보이도록 함 */
            flex-direction: column;
            gap: 25px;
            z-index: 50;
            box-sizing: border-box;
        }

        .close-popup-btn {
            position: absolute;
            top: 25px;
            right: 30px;
            background: transparent;
            border: none;
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--text-gray);
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .close-popup-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            border-radius: 50%; /* 동그란 모양으로 만듭니다 */
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-gray);
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s; /* 부드러운 효과를 위한 transition */
        }

        .close-popup-btn:hover {
            background-color: #f0f0f0; /* 연한 회색 배경 추가 */
            color: #000; /* 글자색을 더 진하게 변경 */
        }

        .add-book-popup h2 {
            font-size: var(--font-medium-small);
            margin: 0;
        }

        .modal-input {
            width: 100%;
            height: 60px;
            border-radius: 30px;
            background-color: var(--background);
            box-shadow: var(--box-shadow);
            border: none;
            padding: 0 25px;
            box-sizing: border-box;
            font-family: var(--font-main);
            font-size: var(--font-very-small);
        }

        .modal-input::placeholder {
            color: var(--shadow-gray);
        }

        .friend-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
            padding: 20px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-radius: 10px;
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: var(--font-very-small);
        }

        .friend-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .friend-add-btn,
        .friend-remove-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-gray);
            background-color: #f0f0f0;
            transition: background-color 0.2s;
        }

        .friend-remove-btn {
            background-color: var(--clover-green);
            color: white;
        }

        .friend-add-btn:hover {
            background-color: #e0e0e0;
        }

        .friend-remove-btn:hover {
            opacity: 0.8;
        }

        .create-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-create {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            background: var(--background);
            box-shadow: var(--box-shadow);
            color: black;
            font-family: var(--font-main);
            font-size: var(--font-very-small);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s;
        }

        .btn-create:hover {
            background: var(--gradient-soda);
            transform: scale(1.02);
        }

    </style>
</head>

<body>
    <div class="background-decorations">
        <div class="bg-star"></div>
        <div class="bg-clover"></div>
        <div class="bg-sparkle"></div>
    </div>

    <div class="nav">
        <div class="left_menu">
            <h2><a href="#">Mogle</a></h2>
            <p class="subtitle"><b>모</b>여서 쓰는 <b>글</b></p>
        </div>

        <div class="middle_menu">
            <p><a href="#" class="active active-home">책장</a></p>
            <p><a href="#">친구 관리</a></p>
            <p><a href="#">마이페이지</a></p>
        </div>

        <div class="right_profile">
            <img src="../content/user-profile.png" alt="profile">
        </div>
    </div>

    <main class="main-content-grid">
        <div class="search-area">
            <a href="home.html" class="add-button btn-gradient soda">+</a>
            <div class="search-box-container">
                <input type="text" placeholder="책장 검색" class="input-basic search-input">
            </div>
        </div>

        <section class="favorite-bookshelves">
            <h2 class="section-title">즐겨찾기한 책장</h2>
            <div class="horizontal-scroll-section" data-scroll-id="1">
                <div class="bookshelf-row">
                    <div class="book-card favorite">
                        <p class="book-title">Best Friend</p>
                        <a href="#" class="star-icon star-filled"><span></span></a>
                    </div>
                    <div class="book-card favorite">
                        <p class="book-title">여행 친구</p>
                        <a href="#" class="star-icon star-filled"><span></span></a>
                    </div>
                    <div class="book-card favorite">
                        <p class="book-title">덕질 메이트</p>
                        <a href="#" class="star-icon star-filled"><span></span></a>
                    </div>
                </div>
            </div>
        </section>

        <section class="all-bookshelves">
            <h2 class="section-title">모든 책장</h2>
            <div class="horizontal-scroll-section" data-scroll-id="2">
                <button class="scroll-button prev-button">&lt;</button>
                <div class="bookshelf-row">
                    <div class="book-card">
                        <p class="book-title">2025 과동기</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">스터디 그룹</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">취미</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">영화</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">개발</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">독서 모임</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">뜨개질</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                </div>
                <button class="scroll-button next-button">&gt;</button>
            </div>
        </section>
    </main>

    <div id="addBookPopup" class="add-book-popup">
        <a href="home.html" class="close-popup-btn">&times;</a>
        <h2>새로운 책장 생성</h2>
        <input type="text" class="modal-input" placeholder="새로운 책장의 이름을 작성하세요.">
        <div class="friend-list">
            <div class="friend-item">
                <div class="friend-info">
                    <div class="friend-icon" style="background-color: var(--clover-green-light);"></div>
                    <span>클로버</span>
                </div>
                <button class="friend-remove-btn">×</button>
            </div>
            <div class="friend-item">
                <div class="friend-info">
                    <div class="friend-icon" style="background-color: var(--star-blue-light);"></div>
                    <span>눈송이</span>
                </div>
                <button class="friend-add-btn">+</button>
            </div>
            <div class="friend-item">
                <div class="friend-info">
                    <div class="friend-icon" style="background-color: var(--sparkle-pink-light);"></div>
                    <span>꽃송이</span>
                </div>
                <button class="friend-add-btn">+</button>
            </div>
            <div class="friend-item">
                <div class="friend-info">
                    <div class="friend-icon" style="background-color: #f0e68c;"></div>
                    <span>눈덩이</span>
                </div>
                <button class="friend-add-btn">+</button>
            </div>
        </div>
        <div class="create-btn-container">
            <button class="btn-create">생성</button>
        </div>
    </div>

</body>

</html>
