<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>홈-Mogle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/12_Mogle_style.css">

    <style>

        /* ==================== 책장 카드 ==================== */
        .book-card {
            position: relative;
            flex-shrink: 0;
            width: 215px;
            height: 215px;
            border-radius: 20px;
            background-color: #fff;
            box-shadow: var(--box-shadow);
            transform: translateY(-3px); 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .book-title {
            font-size: var(--font-very-small);
            color: #000;
            margin: 0;
            padding-left: 5px;
        }



        /* ==================== 팝업 스타일 ==================== */

        .modal-input {
            width: 100%;
            height: 60px;
            border-radius: 30px;
            background-color: var(--background);
            box-shadow: var(--box-shadow);
            border: none;
            padding: 0 25px;
            box-sizing: border-box;
            font-family: var(--font-main);
            font-size: var(--font-very-small);
        }

        .modal-input::placeholder {
            color: var(--shadow-gray);
        }

        .create-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        /* 3. 생성 버튼 스타일 수정 */
        .btn-create {
            padding: 12px 30px;
            border-radius: 25px;
            /* 더 둥글게 */
            border: none;
            background: var(--background); /* 기본 배경을 흰색(var(--background))으로 변경 */
            transition: var(--background) 0.3s ease, transform 0.2s;
            box-shadow: var(--box-shadow);
            color: black;
            font-family: var(--font-main);
            font-size: var(--font-very-small);
            font-weight: bold;
            cursor: pointer;
        }

        .btn-create:hover {
        background: var(--gradient-soda); /* 마우스를 올렸을 때만 그라데이션 적용 */
        transform: scale(1.02);
        }

        main.main-content-grid {
        height: calc(100vh - 96px);
        padding: 30px 78px;
        box-sizing: border-box;
        
        
        display: flex;
        flex-direction: column; 
        gap: 30px;
    }
    .bookshelves-container {
        scrollbar-width: none;-ms-overflow-style: none;
        overflow-y: auto; 
    }


    </style>
</head>
<body>
    <div class="background-decorations">
        <div class="bg-star"></div>
        <div class="bg-clover"></div>
        <div class="bg-sparkle"></div>
    </div>

    <div class="nav">
        <div class="left_menu">
            <h2><a href="#">Mogle</a></h2>
            <p class="subtitle"><b>모</b>여서 쓰는 <b>글</b></p>
        </div>

        <div class="middle_menu">
            <p><a href="#" class="active bg-star-blue">책장</a></p>
            <p><a href="#">친구 관리</a></p>
            <p><a href="#">마이페이지</a></p>
        </div>

        <div class="right_profile">
            <img src="../content/12_user-profile.png" alt="profile">
        </div>
    </div>

    <main class="main-content-grid">
        <div class="search-area">
            <button class="add-button btn-gradient soda"><a href="12_Mogle_home-popup.html">+</a></button>
            <div class="search-box-container">
                <input type="text" placeholder="책장 검색" class="input-basic search-input">
            </div>
        </div>
        <div class="bookshelves-container">
        <section class="favorite-bookshelves">
            <h2 class="section-title" style="margin-top:75px">즐겨찾기한 책장</h2>
            <div class="horizontal-scroll-section" data-scroll-id="1">
                
                <div class="bookshelf-row">
                    <div class="book-card favorite">
                        <p class="book-title">Best Friend</p>
                        <a href="#" class="star-icon star-filled"><span></span></a>
                    </div>
                    <div class="book-card favorite">
                        <p class="book-title">여행 친구</p>
                        <a href="#" class="star-icon star-filled"><span></span></a>
                    </div>
                    <div class="book-card favorite">
                        <p class="book-title">덕질 메이트</p>
                        <a href="#" class="star-icon star-filled"><span></span></a>
                    </div>
                </div>
            </div>
        </section>

        <section class="all-bookshelves">
            <h2 class="section-title">모든 책장</h2>
            <div class="horizontal-scroll-section" data-scroll-id="2">
                <button class="scroll-button prev-button">&lt;</button>
                <div class="bookshelf-row">
                    <div class="book-card">
                        <p class="book-title">2025 과동기</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">스터디 그룹</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">취미</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">영화</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">개발</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">독서 모임</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                    <div class="book-card">
                        <p class="book-title">뜨개질</p><a href="#" class="star-icon star-empty"><span></span></a>
                    </div>
                </div>
                <button class="scroll-button next-button">&gt;</button>
            </div>
        </section>
        </div>
    </main>

</body>
</html>
