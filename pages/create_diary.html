<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mogle - 다이어리 테마 선택</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left-header {
            display: flex;
            align-items: center;
            gap: 50px;
        }
        
        .page-title {
            width: 654px;
            font-size: var(--font-medium-large);
            color: var(--shadow-gray);
            margin-top:10px;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--font-main);
        }

        .page-title::placeholder {
            color: var(--shadow-gray);
        }


        .profile-icon {
            position: relative;
            width: 100px;
            height: 60px;
            margin-bottom: 5px;
        }

        .icon-circle {
            width: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: absolute;
            overflow: hidden;
        }

        .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon-circle:first-child {
            top: 0;
            left: 0;
            z-index: 2;
        }

        .icon-circle:last-child {
            top: 0;
            left: 35px;
            z-index: 1;
        }

        .icon-circle:hover {
            transform: scale(1.02);
        }

        .container {
            max-width: 1280px;
            max-height: 570px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 30px 50px 0px 0px;
            margin-left: auto;
            margin-right: auto;
        }

        .left-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .notebook-card {
            height: 550px;
            width: 460px;
            aspect-ratio: 0.75;
            background: url('../images/테마 4.png');
            background-size: cover;
            background-position: center;
            border-radius: 30px;
            padding: 60px 50px;
            position: relative;
            overflow: hidden;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            place-items: center;
            margin-top: 30px;
        }

        .theme-card {
            height: 190px;
            width: 170px;
            aspect-ratio: 0.7;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .theme-card:hover {
            transform: translateY(-5px) scale(1.02);
        }
    </style>
</head>
<body>
    <div class="background-decorations">
        <div class="bg-clover"></div>
        <div class="bg-star"></div>
        <div class="bg-sparkle"></div>
    </div>    
    <div class="nav">
        <div class="left_menu">
            <h2><a href="index.html">Mogle</a></h2>
            <p class="subtitle"><b>모</b>여서 쓰는 <b>글</b></p>
        </div>
        <!-- 나중에 css 머지 하면 수정 -->
        <input type="text" class="page-title" placeholder="다이어리의 이름을 작성하세요.">
        <div class="profile-icon">
            <div class="icon-circle">
                <img src="../images/클로버 프로필 사진.png" alt="Profile 1" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'clover\'></div>'">
            </div>
            <div class="icon-circle">
                <img src="../images/별 프로필 사진.png" alt="Profile 2" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'clover\'></div>'">
            </div>
        </div>
    </div>

    <div class="container">
        <div class="left-section">
            <div class="notebook-card">
            </div>
        </div>

        <div class="right-section">
            <div class="theme-grid">
                <div class="theme-card">
                    <img src="../images/테마 1.png" alt="테마 1" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../images/테마 2.png" alt="테마 2" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../images/테마 3.png" alt="테마 3" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../images/테마 4.png" alt="테마 4" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../images/테마 5.png" alt="테마 5" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
                <div class="theme-card">
                    <img src="../images/테마 6.png" alt="테마 6" style="width: 100%; height: 100%; object-fit: cover; border-radius: 20px;">
                </div>
            </div>

            <button class="btn-gradient cloud" style="width: 451px; height: 70px; margin-left: auto; margin-right: auto; font-size: var(--font-small);">다이어리 생성</button>
        </div>
    </div>
</body>
</html>
