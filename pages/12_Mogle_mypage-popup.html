<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지-Mogle</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .middle_menu .active {
            background-color: var(--sparkle-pink);
            padding: 10px 20px;
            border-radius: 8px;
            position: relative;
            z-index: 1;
        }

        .nav{
            border-color: var(--sparkle-pink);
        }
        
        .container {
            display: flex;
            background: transparent;
            justify-content: center;
            overflow: visible;
            max-width: 1280px;
            width: 100%;
            position: relative;
            margin: 0 auto;
            min-height: calc(100vh - 100px);
            align-items: stretch;
        }

        .left {
            flex: 1;
            padding: 50px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile-main {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .profile-image {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .emotion-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: var(--font-large);
        }

        .name {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            left: 10px;
            bottom: 50px;
        }

        .edit-icon {
            right: 15px;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        .bookcase {
            display: flex;
            position: relative;
            flex-direction: column;
            width: 100%;
            min-height: 39vh;
            border-radius: 30px;
            background-color: var(--background);
            box-shadow: var(--box-shadow);
            padding: 20px 25px;
        }

        .bookcase-title {
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            border-bottom: 3px dashed var(--clover-green);
            margin-bottom: 20px;
        }

        .bookcase-list {
            width: 100%;
            display: flex;
            gap: 15px;
            flex-direction: column;
        }

        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .multi-profile {
            width: 180px; 
            height: 60px;
        }

        .multi-profile img:first-child {
            z-index: 3;
        }

        .multi-profile img:nth-child(2) {
            z-index: 2;
            margin-left: -25px;
        }

        .multi-profile img:nth-child(3) {
            z-index: 1;
            margin-left: -25px;
        }

        .right{
            flex: 1;
            padding: 50px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .calendar {
            display: flex;
            position: relative;
            flex-direction: column;
            align-items: center;
            min-width: 100%;
            min-height: 70vh;
            border-radius: 30px;
            background-color: var(--background);
            box-shadow: var(--box-shadow);
            padding: 20px 20px 8vh 20px;
        }

        .calendar-month {
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr); 
            width: 100%;
            gap: 10px;
        }

        .grid-cell {
            text-align: center;
            padding: 5px 0;
        }

        .weekday {
            font-size: var(--font-very-small);
            border-bottom: 2px solid var(--star-blue);
        }

        .date {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 60px;
            font-size: var(--font-very-small);
            border-bottom: 1px solid var(--shadow-gray);
        }

        .date.empty {
            border-bottom: none;
        }
        
        .visited-star {
            width: 30px;
            height: 30px;
        }

        .emotion-modal-static {
            display: block;
            position: absolute;
            background: var(--background);
            border-radius: 40px;
            border-top-left-radius: 0;
            box-shadow: var(--box-shadow);
            width: auto;
            height: 70px;
            top: 110%;
            left: 80%;
            transform: translateY(-50%);
            margin-left: 20px;
            z-index: 10;
        }

        .emotion-grid {
            display: flex;
            gap: 10px;
        }

        .emotion-position {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .emotion-position:hover {
            transform: scale(1.2);
        }

    </style>
</head>


<body>
    <div class="background-decorations">
        <div class="bg-star"></div>
        <div class="bg-clover"></div>
        <div class="bg-sparkle"></div>
    </div>
    <div class="nav">
        <div class="left_menu">
            <h2><a href="#">Mogle</a></h2>
            <p class="subtitle"><b>모</b>여서 쓰는 <b>글</b></p>
        </div>
        <div class="middle_menu">
            <p><a href="#">책장</a></p>
            <p><a href="#">친구 관리</a></p>
            <p><a href="#"class="active">마이페이지</a></p>
        </div>
        <div class="right_profile">
            <img src="../content/user-profile.png">
        </div>
    </div>


    <div class="container">
        <div class="left">
            <div class="profile-main">
                <div class="profile-image">
                    <img src="../content/user-profile.png" style="width: 200px;" alt="사용자 프로필">
                    <div class="emotion-icon">😆</div>
                    <div class="emotion-modal-static">
                        <div class="emotion-grid">
                            <div class="emotion-position">😆</div>
                            <div class="emotion-position">😍</div>
                            <div class="emotion-position">🙂</div>
                            <div class="emotion-position">😥</div>
                            <div class="emotion-position">🥱</div>
                            <div class="emotion-position">😫</div>
                            <div class="emotion-position">😖</div>
                            <div class="emotion-position">😰</div>
                        </div>
                    </div>

                </div>
                <div class="name input-basic" style="width: 305px;">
                    <span class="text-medium-small font-main">눈송이</span>
                    <div class="edit-icon">
                        <img src="../content/닉네임 수정 버튼.png" alt="연필">
                    </div>
                </div>
            </div>

            <div class="bookcase">
                <div class="bookcase-title">
                    <span class="text-medium font-main">내 책장</span>
                </div>
                <div class="bookcase-list">
                    <div class="book-item">
                        <span class="text-medium-small font-main">2025 과동기</span>
                        <div class="multi-profile">
                            <img src="../content/clover-user-profile.png" alt="클로버 프로필" class="first-child">
                            <img src="../content/heart-user-profile.png" alt="하트 프로필" class="2th-child">
                        </div>
                    </div>
                    <div class="book-item">
                        <span class="text-medium-small font-main">2025 웹프로그래밍</span>
                        <div class="multi-profile">
                            <img src="../content/paw-user-profile.png" alt="발바닥 프로필" class="first-child">
                            <img src="../content/sparkle-user-profile.png" alt="반짝 프로필" class="2th-child">
                            <img src="../content/heart-user-profile.png" alt="하트 프로필" class="3th-child">
                        </div>
                    </div>
                </div>
            </div>
            
        </div>

        <div class="right">
            <div class="calendar">

                <div class="calendar-month">
                    <span class="text-medium-small">&lt; 10월 &gt;</span>
                </div>

                <div class="calendar-grid">
                    <div class="grid-cell weekday">월</div>
                    <div class="grid-cell weekday">화</div>
                    <div class="grid-cell weekday">수</div>
                    <div class="grid-cell weekday">목</div>
                    <div class="grid-cell weekday">금</div>
                    <div class="grid-cell weekday">토</div>
                    <div class="grid-cell weekday">일</div>

                    <div class="grid-cell date empty"></div>
                    <div class="grid-cell date empty"></div>
                    <div class="grid-cell date">
                        <span>1</span>
                        <img src="../content/별.png" alt="별" class="visited-star">
                    </div>
                    <div class="grid-cell date"><span>2</span></div>
                    <div class="grid-cell date"><span>3</span></div>
                    <div class="grid-cell date">
                        <span>4</span>
                        <img src="../content/별.png" alt="별" class="visited-star">
                    </div>
                    <div class="grid-cell date"><span>5</span></div>
                    <div class="grid-cell date"><span>6</span></div>
                    <div class="grid-cell date"><span>7</span></div>
                    <div class="grid-cell date"><span>8</span></div>
                    <div class="grid-cell date"><span>9</span></div>
                    <div class="grid-cell date"><span>10</span></div>
                    <div class="grid-cell date"><span>11</span></div>
                    <div class="grid-cell date"><span>12</span></div>
                    <div class="grid-cell date"><span>13</span></div>
                    <div class="grid-cell date"><span>14</span></div>
                    <div class="grid-cell date"><span>15</span></div>
                    <div class="grid-cell date"><span>16</span></div>
                    <div class="grid-cell date"><span>17</span></div>
                    <div class="grid-cell date"><span>18</span></div>
                    <div class="grid-cell date"><span>19</span></div>
                    <div class="grid-cell date"><span>20</span></div>
                    <div class="grid-cell date"><span>21</span></div>
                    <div class="grid-cell date"><span>22</span></div>
                    <div class="grid-cell date"><span>23</span></div>
                    <div class="grid-cell date"><span>24</span></div>
                    <div class="grid-cell date"><span>25</span></div>
                    <div class="grid-cell date"><span>26</span></div>
                    <div class="grid-cell date"><span>27</span></div>
                    <div class="grid-cell date"><span>28</span></div>
                    <div class="grid-cell date"><span>29</span></div>
                    <div class="grid-cell date"><span>30</span></div>
                    <div class="grid-cell date"><span>31</span></div>
                    <div class="grid-cell date empty"></div>
                    <div class="grid-cell date empty"></div>
            </div>
        </div>
    </div>

</body>
