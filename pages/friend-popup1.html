<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>배경 꾸미기</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>

        .middle_menu .active {
            background-color: var(--clover-green);
            padding: 10px 20px;
            border-radius: 8px;
        }
        /* ==================== 친구 목록 ==================== */
        .friend-list-container {
            width: 985px;
            height: 400px;

            z-index: 2;
    
            /* Grid 안에서 수평 중앙 정렬 */
            margin: 0 auto; 
    
            /* top 대신 위쪽 여백으로 위치 조정 */
            margin-top: 120px;

            /* 스크롤 핵심 속성 */
            overflow-y: auto; /* 세로 내용이 넘칠 경우에만 스크롤바를 보여줌 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .friend-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 친구 한 명 카드 공통 스타일 */
        .friend-item {
            position: relative;

            width: 90%;
            height: 130px;
            left: 50px;
            border-radius: 30px;
            background-color: white;
            box-shadow: var(--box-shadow);
        }

        .friend-info{
            position: absolute;
            display: flex;
            flex-direction: column;

            width: 751px;
            height: 115px;
            top: 24px;
            left: 163px;
        }

        .friend-name-container{
            position: absolute;
            display: flex;

            width: 106px;
            height: 56px;
            top: 10px;
        }

        .friend-desc-container{
            position: absolute;
            display: flex;

            width: 506px;
            height: 61px;
            top: 55px;
        }

        .profile-picture{
            position: absolute;
            width: 80px;
            height: 80px;
            top: 31px;
            left: 33px;
            border-radius: 100px;
            border-width: 3px;

            background-size: cover; /* 이미지가 원을 꽉 채우도록 설정 */
            background-position: center;
        }

        .friend-item:nth-child(1) .profile-picture {
            background-image: url("../content/heart-user-profile.png");
        }

        .friend-item:nth-child(2) .profile-picture {
            background-image: url("../content/paw-user-profile.png");
        }

        .friend-item:nth-child(3) .profile-picture {
            background-image: url("../content/sparkle-user-profile.png");
        }

        .mood {
            width: 35px;
            height: 35px;
            top: 80px;
            left: 80px;
            border-radius: 100px;
            position: absolute;
            background-color: white;
            box-shadow: var(--box-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .more-options-btn {
            position: absolute;
        
            width: 40px;
            height: 54px;
            top: 45px;
            left: 800px;

            background: none;
            border: none;
            background-color: white;
        
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: var(--font-medium-small);
        
            cursor: pointer;
        }

    /* ==================== 더보기 버튼 클릭시 생성되는 팝업 ==================== */

        .options-popup {
        /* 평소에는 숨겨둡니다. */
            display: flex;
            z-index: 10; 
        
            position: absolute;
            width: 330px;
            height: 118px;
            top: 300px;
            left: 800px;

            border-top-left-radius: 40px;
            border-bottom-right-radius: 40px;
            border-bottom-left-radius: 40px;
        
            background-color: white;
            box-shadow: var(--box-shadow);
            padding: 10px;
            box-sizing: border-box;

            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }

        .friend-bs-add{
            display: flex;
            position: absolute;
            width: 164;
            height: 34;
            top: 21px;
            left: 83px;
            font-size: var(--font-small);
        }

        .friend-del{
            display: flex;
            position: absolute;
            width: 93;
            height: 34;
            top: 69px;
            left: 118px;
            font-size: var(--font-small);
            color: var(--warning);
        }

    /* ==================== 친구 추가 버튼 클릭시 생성되는 창 ==================== */

        .option-friend-add
        {
            /* 평소에는 숨겨둡니다. */
            display: none;
            z-index: 11;
            position: absolute;

            width: 565px;
            height: 217px;
            top: 200px;
            left: 400px;
            border-top-left-radius: 40px;
            border-bottom-right-radius: 40px;
            border-bottom-left-radius: 40px;
            box-shadow: var(--box-shadow);
            background-color: white;
            padding: 10px;
            box-sizing: border-box;

            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }

        .friend-add{
            width: 131;
            height: 47;
            top: 20px;
            left: 26px;
            position: absolute;
            display: flex;
            font-size: var(--font-medium);
        }

        .friend-email{
            width: 387px;
            height: 70px;
            top: 86px;
            left: 26px;
            border-radius: 30px;
            position: absolute;
            display: flex;
        }

        .search-box-container.friend-add {
            position: absolute;
            width: 500px;
        }

        .friend-add-button{
            width: 101px;
            height: 70px;
            border-radius: 30px;
            top: 86px;
            left: 431px;
            border-radius: 40px;
            position: absolute;
            display: flex;
            box-shadow: var(--box-shadow);
            border: none;
            cursor: pointer;
            font-family: var(--font-main);
            font-size: var(--font-very-small);
            transition: background 0.3s ease;
            background: var(--gradient-soda);
            justify-content: center;
            align-items: center;
        }

        .friend-add-warning{
            width: 264px;
            height: 27px;
            top: 175px;
            left: 40px;
            position: absolute;
            font-size: var(--font-very-small);
            color: var(--warning);
            display: flex;
        }
    </style>
</head>
<body>
    <div class="background-decorations">
        <div class="bg-clover"></div>
        <div class="bg-star"></div>
        <div class="bg-sparkle"></div>
    </div>

    <div class="nav">
        <div class="left_menu">
            <h2><a href="index.html">Mogle</a></h2>
            <p class="subtitle"><b>모</b>여서 쓰는 <b>글</b></p>
        </div>
        
        <div class="middle_menu">
            <p><a href="pf_home.html" >책장</a></p>
            <p><a href="pf_photo.html" class="active">친구 관리</a></p>
            <p><a href="pf_music.html">마이페이지</a></p>
        </div>
        
        <div class="right_profile">
            <img src="../content/user-profile.png" alt="profile">
        </div>
    </div>

    <main class="main-content-grid">
    <div class="search-area">
        <button class="add-button btn-gradient soda">+</button> 
        
        <div class="search-box-container">
            <input type="text" placeholder="친구 검색" class="input-basic search-input">
        </div>
    </div>

        <div class="friend-list-container">
            <ul class="friend-list">
                <li class="friend-item">
                    <div class="profile-picture"></div>

                    <div class="friend-info">
                        <div class="friend-name-container">
                            <span class="text-medium-small font-main">클로버</span>
                        </div>

                        <div class="friend-desc-container">
                            <span class="text-small font-main">
                                공유 책장 | 
                                <a href="#" class="color-blue-text">Best Friend</a>
                            </span>
                        </div>
                    </div>
                    <button class="more-options-btn">⋮</button>
                </li>

                <li class="friend-item">
                    <div class="profile-picture"></div>

                    <div class="friend-info">
                        <div class="friend-name-container">
                            <span class="text-medium-small font-main">눈숙명</span>
                        </div>

                        <div class="friend-desc-container">
                            <span class="text-small font-main">
                                공유 책장 | 
                                <a href="#" class="color-blue-text">고딩칭구들</a>
                            </span>
                        </div>
                    </div>
                    <button class="more-options-btn">⋮</button>
                </li>

                <li class="friend-item">
                    <div class="profile-picture"></div>
                    <div class="mood">😆</div>

                    <div class="friend-info">
                        <div class="friend-name-container">
                            <span class="text-medium-small font-main">김송이</span>
                        </div>

                        <div class="friend-desc-container">
                            <span class="text-small font-main">
                                공유 책장 | 
                                <a href="#" class="color-blue-text">2025 과동기</a>
                            </span>
                        </div>
                    </div>
                    <button class="more-options-btn">⋮</button>
                </li>
            </ul>
            <div class="options-popup">
                <a herf class="friend-bs-add">함께할 책장 추가</a>
                <a href class="friend-del">친구 삭제</a>
            </div>
        </div>
    </div>
    <div class="option-friend-add">
        <a herf class="friend-add">친구 추가</a>
        <div class="friend-email">
            <input type="text" placeholder="친구의 이메일을 입력하세요" class="input-basic search-input">
        </div>
        <button class="friend-add-button">추가</button>
        <div class="friend-add-warning">이메일 형식이 일치하지 않습니다.</div>
    </div>
    </main>
</body>

</html>
