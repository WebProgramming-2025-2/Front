<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            background: transparent;
            justify-content: center;
            overflow: visible;
            max-width: 1280px;
            width: 100%;
            position: relative;
            margin: 0 auto;
        }

        .left-section {
            flex: 1;
            padding: 20px 60px 40px 40px;
            background: transparent;
        }

        .profile-section {
            display: flex;
            align-items: center;
            margin-bottom: 60px;
        }

        .profile-image {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-left: 40px;
            position: relative;
        }

        .right-section {
            flex: 1;
            padding: 0px 40px 40px 60px;
            background: transparent;
        }

        .pencil-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .name-input {
            flex: 1;
            flex-direction: column;
        }

        .name-input label {
            font-size: var(--font-medium-small);
            margin-bottom: 20px;
            margin-left: 25px;
            display: block;
        }

        .form-group {
            margin-top: 10px;
            margin-left: 20px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 51px;
        }

        .input-label {
            font-size: var(--font-medium-small);
            min-width: 60px;
        }

        .error-message {
            color: var(--warning);
            font-size: var(--font-tiny);
            margin-top: -35px;
            margin-left: 85px;
        }

        .email-verify-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 50px;
        }

        .email-verify-section input {
            flex: 1;
        }

        .verification-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .status-text {
            font-size: var(--font-tiny);
            margin-top: 10px;
        }

        .mogle-link {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-small);
            font-weight: 400;
            margin-top: 50px;
            margin-bottom: 4px;
            padding-top: 50px;
            border-top: 2px solid var(--sparkle-pink);
        }

        /* 아이콘 팝업 */
        .icon-modal-static {
            display: block;
            position: absolute;
            height: 264px;
            background: white;
            border-radius: 40px;
            border-top-left-radius: 0;
            padding: 15px;
            box-shadow: var(--box-shadow);
            top: 100%;
            right: -240%;
            width: 240%;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 7px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .icon-item:hover .icon-circle {
            transform: scale(1.0);
            box-shadow: var(--box-shadow);
        }

        .icon-label {
            font-size: 15px;
        }
    </style>
</head>
