<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이어리 목록 화면 - Mogle</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .middle_menu {
            justify-content: flex-start;
            padding-left: 80px;
            gap: 8px;
        }
    
        .star-icon {
            position: static;
            width: 50px;
            height: 50px;
        }


/* ==================== 카드 배치 및 스타일 ==================== */


.diary-container {
    display: flex;
    justify-content: center; 
    gap: 50px; 
    padding-top: 50px;
}
.diary-card{
    position: relative;
    border-radius: 20px;
    background-color: #fff;
    box-shadow: var(--box-shadow);
    width: 700px; 
    height: 705px;
    padding: 30px; 
    box-sizing: border-box; 
}

.diary-textarea {
    width: 100%;
    height: 100%;
    border: none;
    resize: none; 
    font-family: var(--font-main);
    font-size: var(--font-medium-small); 
    background-color: transparent;
    padding: 0;
    box-sizing: border-box;
    outline: none;
}

.card-main-title {
    margin-top: 0;
    margin-bottom: 10px; /* 날짜와의 간격 */
    text-align: center; /* 텍스트 자체를 중앙 정렬 */
}


.card-date {
    margin-left: 10px; /* 날짜와의 간격 */
    text-align: left; /* 텍스트 자체를 중앙 정렬 */
}

.side-arrow-left {
    position: fixed;
    top: 80%;
    left: 0;
    transform: translateY(-50%);
    border: none;
    background-color: var(--sparkle-pink); 
    width: 50px;
    height: 100px;
    border-radius: 0 60px 60px 0; 
    display: flex;
    align-items: center;
    justify-content: center;

    -webkit-text-fill-color: white;
    font-size: var(--font-medium-small);
    cursor: pointer;
    z-index: 5;
    padding: 0;
    line-height: 1; 
}

.side-arrow-left:hover {
       background-color: var(--sparkle-pink-light);       
}

.create-btn-container {
    position: absolute; 
    bottom: 30px; 
    right: 30px; 
    
    display: flex;
    justify-content: flex-end; 
    width: auto; 

    margin-top: 0; 
    z-index: 2; 
}

.btn-create {
    padding: 12px 30px;
    border-radius: 25px;
    border: none;
    background: var(--background);
    box-shadow: var(--box-shadow);
    color: black;
    font-family: var(--font-main);
    font-size: var(--font-very-small);
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s;
}

.btn-create:hover {
    background: var(--gradient-cloud);
    transform: scale(1.02);
    
}

    </style>
</head>
<body>
    <div class="background-decorations">
        <div class="bg-star"></div>
        <div class="bg-clover"></div>
        <div class="bg-sparkle"></div>
    </div>

    <div class="nav">
        <div class="left_menu">
            <h2><a href="#">Mogle</a></h2>
            <p class="subtitle"><b>모</b>여서 쓰는 <b>글</b></p>
        </div>
        
        <div class="middle_menu">
            <div class="title-with-star">
                <p><a class="active-diary">보라카이✈️</a></p>
                <img src="../content/별.png" class="star-icon">
            </div>
        </div>
        
        <div class="multi-profile">
            <img src="../content/clover-user-profile.png">
            <img src="../content/user-profile.png" alt="profile">
        </div>
    </div>
    <main class="diary-container">
        <div class="diary-card info-card">
            <h3 class="card-main-title text-very-large">보라카이 ✈️</h3>
            <p class="card-date text-medium">2025.08</p>
        </div>
        
        <div class="diary-card text-input-card">
            <textarea class="diary-textarea text-medium-small" placeholder="재미있었다!"></textarea>
                    <div class="create-btn-container">
            <button class="btn-create" type="submit">업로드</button>
        </div>
        
        </div>
    </main>
    <button class="side-arrow-left">
         <p><a href="#">>></a></p>
    </button>


</body>
</html>
